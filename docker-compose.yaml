services:

  webapp-postgres:
    image: postgres:latest
    container_name: rl_app-postgres
    hostname: rl_app-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=rlapp
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=dev123
      - POSTGRES_PORT=5432
    volumes:
      - ./var/db/postgresql/webapp:/var/lib/postgresql/data
    # please uncomment next line to enable full PostgreSQL logging
    # it might be very useful for debugging purposes
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "dev", "-d", "cryptoappdb" ]
      interval: 5s
      retries: 5

